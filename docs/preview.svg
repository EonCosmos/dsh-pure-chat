<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none" role="img" aria-label="Pure chat: a conversation with web tools, document export and a clear-context control">
  <!-- conversation card -->
  <rect x="40" y="64" width="212" height="172" rx="16" stroke="#8B97A8" stroke-opacity="0.45" fill="#4C7DFF" fill-opacity="0.05"/>
  <rect x="60" y="88" width="150" height="10" rx="5" fill="#8B97A8" fill-opacity="0.45"/>
  <rect x="60" y="108" width="172" height="10" rx="5" fill="#8B97A8" fill-opacity="0.35"/>
  <rect x="60" y="128" width="118" height="10" rx="5" fill="#4C7DFF" fill-opacity="0.55"/>
  <rect x="60" y="152" width="96" height="10" rx="5" fill="#8B97A8" fill-opacity="0.35"/>
  <!-- composer row inside the card -->
  <rect x="60" y="186" width="172" height="30" rx="15" stroke="#8B97A8" stroke-opacity="0.4" fill="#8B97A8" fill-opacity="0.1"/>
  <!-- clear-context control: circular arrow -->
  <circle cx="80" cy="201" r="9" stroke="#4C7DFF" stroke-width="1.8"/>
  <path d="M83.5 197.5a5 5 0 1 0 1.2 3.6" stroke="#4C7DFF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M84.8 196.2v2.6h-2.6" stroke="#4C7DFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- send arrow -->
  <path d="M212 195l12 6-12 6 3-6-3-6z" fill="#8B97A8" fill-opacity="0.65"/>

  <!-- arrow to exported documents -->
  <path d="M268 150h44" stroke="#8B97A8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M306 144l8 6-8 6" stroke="#8B97A8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- exported documents: three above, two below -->
  <g stroke="#8B97A8" stroke-opacity="0.5" fill="#4C7DFF" fill-opacity="0.04">
    <rect x="332" y="58" width="72" height="86" rx="9"/>
    <rect x="424" y="58" width="72" height="86" rx="9"/>
    <rect x="516" y="58" width="72" height="86" rx="9"/>
    <rect x="378" y="160" width="72" height="86" rx="9"/>
    <rect x="470" y="160" width="72" height="86" rx="9"/>
  </g>
  <!-- plain text lines -->
  <g stroke="#8B97A8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M346 80h44M346 94h44M346 108h30"/>
  </g>
  <!-- markdown: heading plus short lines -->
  <g stroke="#8B97A8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M438 80h30M438 94h44M438 108h44M438 122h24"/>
  </g>
  <!-- document: page fold -->
  <path d="M530 68h34l14 14v48h-48V68z" stroke="#8B97A8" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M564 68v14h14" stroke="#4C7DFF" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#8B97A8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M540 98h34M540 112h34M540 126h22"/>
  </g>
  <!-- spreadsheet grid -->
  <g stroke="#8B97A8" stroke-opacity="0.5" stroke-width="1.6">
    <rect x="392" y="180" width="44" height="46" rx="3"/>
    <path d="M392 196h44M392 211h44M407 180v46M422 180v46"/>
  </g>
  <!-- document with a chart -->
  <path d="M484 170h34l14 14v48h-48v-62z" stroke="#8B97A8" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M518 170v14h14" stroke="#4C7DFF" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round"/>
  <path d="M494 218l10-12 8 7 12-16" stroke="#4C7DFF" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
