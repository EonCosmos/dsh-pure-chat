# Pure chat: one selectable agent preset whose requests carry the conversation
# plus only the two read-only web tools. The empty complete persona removes the
# whole system prompt (Harness identity, agent instructions, tool guidance,
# runtime context); the local plugin hides every host-global tool that the
# preset would otherwise inherit, while leaving the preset's web tools visible.
- insert:
    - id: preset-pure-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pure-chat
        name: 纯对话
        description: 直接和模型对话，可以联网搜索和读取网页；没有系统提示词，也没有文件、命令、技能或子代理工具。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              complete: true
              includeRuntimeContext: false
          - id: web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: true
          - id: no-global-tools
            name: '@local/dsh-pure-chat'
