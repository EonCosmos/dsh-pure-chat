# Pure chat: one agent preset plus the package's own top-level row.
#
# `pure-chat-host` is the only Loader row this bundle inserts. It carries two
# jobs: the Web client serves a package's `dsh.client` bundle only for a
# profile-tree entry named after that package (so this row is what puts the
# clear-context control into the page), and its plugin registers the `pure-chat`
# preset with display text in the host language — DSH never translates
# user-authored preset metadata, so a declaration here could only ever ship one
# mixed or single-language label.
#
# The preset composition itself lives in `index.js` (`./lib/preset-text.js` owns
# the per-language copy): the empty complete persona removes the whole system
# prompt, `@deepseek-ai/dsh-tool-web` mounts the two web tools, and
# `dsh-pure-chat/preset` hides every host-global tool, mounts `write_file`, and
# registers the `/clear-context` command.
- insert:
    - id: pure-chat-host
      name: 'dsh-pure-chat'
